name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - master
  repository_dispatch:
    types:
      - holywater-updated
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Holy Water
        uses: actions/checkout@v4
        with:
          repository: Surager/holywater
          path: holywater

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build Holy Water
        run: |
          mkdir -p HolyWater
          cd holywater
          uv sync
          uv run holywater build --output ../HolyWater/index.html
          {
            echo "---"
            echo "layout: null"
            echo "permalink: /HolyWater/"
            echo "---"
            cat ../HolyWater/index.html
          } > ../HolyWater/index.html.tmp
          mv ../HolyWater/index.html.tmp ../HolyWater/index.html

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Test
        run: bundle exec rake test

      - name: Build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
