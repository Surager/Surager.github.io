---
layout: default
---
{% include page-assets.html %}
{% if page.jekyll-theme-WuK.page.masthead.enable %}
<div class="masthead">
  <div class="container">
    <h3 class="masthead-title">
      <a href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a>
      <small>{{ site.tagline }}</small>
    </h3>
  </div>
</div>
{% endif %}
<div class="container content">
  <div class="page">
    {% if page.jekyll-theme-WuK.page.title.enable %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% endif %}
    {{ content }}
  </div>
</div>
